<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Site</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
}

/* Topo */
header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

/* Hero */
.hero {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: white;
    padding: 60px 20px;
    text-align: center;
}

.hero h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

.hero button {
    padding: 12px 25px;
    border: none;
    background: white;
    color: #333;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
}

/* Cards */
.container {
    padding: 40px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Rodapé */
footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}
</style>

</head>

<body>

<header>
    <h2>Meu Site Moderno</h2>
</header>

<section class="hero">
    <h1>Bem-vindo!</h1>
    <p>Um design simples e bonito em HTML + CSS</p>
    <button>Clique aqui</button>
</section>

<section class="container">

    <div class="card">
        <h3>Serviço 1</h3>
        <p>Descrição do serviço.</p>
    </div>

    <div class="card">
        <h3>Serviço 2</h3>
        <p>Descrição do serviço.</p>
    </div>

    <div class="card">
        <h3>Serviço 3</h3>
        <p>Descrição do serviço.</p>
    </div>

</section>

<footer>
    © 2026 - Meu Site
</footer>

</body>
</html>
